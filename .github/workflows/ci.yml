# CI smoke gates (issue #14): two cheap invariants on push to `main` and on
# pull requests — the Python code byte-compiles, and the pipeline and viz
# container images still build. Never fetches or requires the private raw data
# set, never runs the integration suite (that needs a PostGIS dev DB + the raw
# data).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module and test
        run: python -m compileall -q etl viz tests scripts docker

  image-build:
    name: Build pipeline + viz images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline container image
        run: docker build -t etl-pipeline:ci .

      - name: Build viz container image
        run: docker build -f Dockerfile.viz -t viz-app:ci .