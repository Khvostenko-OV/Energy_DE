# Containerized ETL + viz stack (issues #13/#15/#28).
#
#   db        PostGIS server; created fresh from the image on first `up`. The
#             image entrypoint enables the PostGIS extension in the default
#             database (POSTGRES_DB), so no extra DDL is needed.
#             imresamu/postgis is a multi-arch (amd64 + arm64) rebuild of the
#             official postgis/postgis images, so the database runs natively on
#             Apple Silicon instead of x86 emulation (postgis/postgis is
#             amd64-only). Same PostGIS behaviour, same postgres entrypoint.
#             On a fresh db volume, docker/viz_reader.sql runs from
#             /docker-entrypoint-initdb.d to provision the read-only
#             `viz_reader` role the viz service connects as.
#
#   pipeline  the `python -m etl` CLI in a container. `docker compose up`
#             (and `run --rm pipeline`) executes the full pass (`run-all`)
#             against `db`, which verifies every stage and fails loudly on drift.
#
#   viz       the Streamlit + PyDeck app in its own container, always running
#             alongside the stack at http://localhost:8501 (no auth). It reads
#             the marts/core/service tables through the read-only `viz_reader`
#             role via the VIZ_DATABASE_URL that the data-volume seed writes.
#
# The raw data set + connection settings live in the DETACHED named volume
# `etl_data` (external: the seed script, scripts/seed_data_volume.sh, creates
# it once per machine). The pipeline and viz containers mount it at /app/data
# and the shared entrypoint sources /app/data/docker.env for DATABASE_URL /
# VIZ_DATABASE_URL — nothing data- or secret-like is baked into the images or
# this file, and the pipeline code is unchanged.
#
# db credentials: POSTGRES_* here and the DATABASE_URL written by the seed
# script are a coupled pair — change both (and re-seed) if you deviate.
# The viz_reader password follows suit: it is written by the seed script as
# VIZ_DATABASE_URL and hard-coded in docker/viz_reader.sql — change both.
# See docs/containerization.md.

name: energy-de-etl

services:
  db:
    # Multi-arch (arm64 + amd64): native on Apple Silicon, no emulation.
    # alpine variant keeps the image small.
    image: imresamu/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-energy_de}
    restart: always
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Provision the read-only viz_reader role on a fresh db volume. A
      # single-file mount (not a directory) keeps the image's own
      # /docker-entrypoint-initdb.d PostGIS bootstrap scripts visible; the
      # `99-` prefix runs this after them. Idempotent (docker/viz_reader.sql).
      - ./docker/viz_reader.sql:/docker-entrypoint-initdb.d/99-viz-reader.sql:ro
    healthcheck:
      # Force TCP: the postgres image runs a temporary socket-only init server
      # (listen_addresses='') to apply the PostGIS extension scripts before
      # restarting as the real server. A socket-checking pg_isready goes green
      # during init, so the pipeline would start into the restart window; over
      # TCP it stays unhealthy until the real listener is accepting.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-energy_de}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline:
    build: .
    # `run_all` is the Python function name; Click surfaces it as `run-all`
    # (the same name the host CLI uses — the image behaviour is identical).
    command: ["python", "-m", "etl", "run-all"]
    environment:
      DATA_ENV_FILE: /app/data/docker.env
    volumes:
      - etl_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  viz:
    build:
      context: .
      dockerfile: Dockerfile.viz
    restart: always
    # "streamlit run viz/app.py --server.headless --server.address
    # 0.0.0.0 --server.port 8501" is the image's default command; nothing to
    # override here. The entrypoint sources VIZ_DATABASE_URL from the seeded
    # volume (the app reads it with a DATABASE_URL fallback, viz/data.py).
    environment:
      DATA_ENV_FILE: /app/data/docker.env
    ports:
      - "${VIZ_PORT:-8501}:8501"
    volumes:
      - etl_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Streamlit's own health probe; python supplies urllib out of the box
      # (the slim image ships no curl). GET /_stcore/health -> 200 "ok".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
  etl_data:
    external: true
    name: ${ETL_DATA_VOLUME:-etl_data}