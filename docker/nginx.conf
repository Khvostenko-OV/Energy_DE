# nginx config for the compose `nginx` service (remote/server entry point).
#
# The viz container runs Streamlit inside the compose network on port 8501 but
# publishes no host port (fat_compose.yaml, server variant); nginx below is the only
# externally reachable surface, proxying HTTP on port 80 to it. Streamlit's
# live runtime is WebSocket-based, so the proxy forwards Upgrade/Connection
# headers and keeps long-lived connections (<_stcore/stream> rerun sockets).

server {
    listen 80;
    server_name _;

    # Long-lived Streamlit connections: the browser holds one socket per
    # page/session, and reruns happen over an open websocket. Give the proxy a
    # generous timeout so idle-but-open sockets aren't killed mid-session.
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://viz:8501;

        # WebSocket upgrade for Streamlit's live runtime.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve the original request metadata for the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit health probe must also route (the compose healthcheck hits nginx
    # on this path). The `location /` block above already covers it; this block
    # just documents the intent and keeps headers minimal for the probe.
    location = /_stcore/health {
        proxy_pass http://viz:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}