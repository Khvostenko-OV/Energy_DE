# Containerized ETL stack (issue #13/#15).
#
#   db        PostGIS server; created fresh from the image on first `up`. The
#             image entrypoint enables the PostGIS extension in the default
#             database (POSTGRES_DB), so no extra DDL is needed.
#             imresamu/postgis is a multi-arch (amd64 + arm64) rebuild of the
#             official postgis/postgis images, so the database runs natively on
#             Apple Silicon instead of x86 emulation (postgis/postgis is
#             amd64-only). Same PostGIS behaviour, same postgres entrypoint.
#
#   pipeline  the `python -m etl` CLI in a container. `docker compose up`
#             (and `run --rm pipeline`) executes the full pass (`run-all`)
#             against `db`, which verifies every stage and fails loudly on drift.
#
#   metabase  Metabase analytics dashboard, always running alongside the stack.
#             Uses an embedded H2 app-db in a persistent volume for its own state.
#             Open at http://localhost:3000. The marts PostGIS is registered
#             manually or via the #15 bootstrap script.
#
# The raw data set + connection settings live in the DETACHED named volume
# `etl_data` (external: the seed script, scripts/seed_data_volume.sh, creates
# it once per machine). The pipeline mounts it at /app/data and the entrypoint
# sources /app/data/docker.env for DATABASE_URL — nothing data- or secret-like
# is baked into the image or this file, and the pipeline code is unchanged.
#
# db credentials: POSTGRES_* here and the DATABASE_URL written by the seed
# script are a coupled pair — change both (and re-seed) if you deviate.
# See docs/containerization.md.

name: energy-de-etl

services:
  db:
    # Multi-arch (arm64 + amd64): native on Apple Silicon, no emulation.
    # alpine variant keeps the image small.
    image: imresamu/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-energy_de}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Force TCP: the postgres image runs a temporary socket-only init server
      # (listen_addresses='') to apply the PostGIS extension scripts before
      # restarting as the real server. A socket-checking pg_isready goes green
      # during init, so the pipeline would start into the restart window; over
      # TCP it stays unhealthy until the real listener is accepting.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-energy_de}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline:
    build: .
    # `run_all` is the Python function name; Click surfaces it as `run-all`
    # (the same name the host CLI uses — the image behaviour is identical).
    command: ["python", "-m", "etl", "run-all"]
    environment:
      DATA_ENV_FILE: /app/data/docker.env
    volumes:
      - etl_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      # Embedded H2 app-db: keeps Metabase state (admin, dashboards, DB
      # connections) inside a dedicated persistent volume — no extra postgres
      # required. Swap to MB_DB_TYPE=postgres / MB_DB_DBNAME / MB_DB_USER /
      # MB_DB_PASS if a real app-db is preferred later.
      MB_DB_FILE: /metabase.db/metabase.db
      JAVA_OPTS: -Xmx1g
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  db_data:
  etl_data:
    external: true
    name: ${ETL_DATA_VOLUME:-etl_data}
  metabase_data: